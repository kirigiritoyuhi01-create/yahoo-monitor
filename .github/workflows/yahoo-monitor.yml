name: yahoo-monitor

on:
  schedule:
    - cron: "0 22 * * *"   # JST 07:00
    - cron: "0 11 * * *"   # JST 20:00
    - cron: "1 15 * * *"   # JST 24:01
  workflow_dispatch:

jobs:
  yahoo-monitor:
    name: Yahoo Shopping Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_yahoo.txt

      - name: Install dependencies
        run: pip install -r requirements_yahoo.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          sudo apt-get install -y libasound2t64 libatk1.0-0 libcups2 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2

      - name: Run Yahoo Monitor
        env:
          YAHOO_APP_ID:             ${{ secrets.YAHOO_APP_ID }}
          SPREADSHEET_ID:           ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME:               ${{ secrets.SHEET_NAME }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python yahoo_monitor.py
